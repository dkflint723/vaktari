name: build

# TEMPORARY. Borrowed for one measurement and restored before committing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: What the tree delete leaves behind
        run: >
          dotnet test tests/Vaktari.Windows.Tests -c Debug
          --filter "FullyQualifiedName~Vaktari.Windows.Tests.DeleteTests|FullyQualifiedName~Vaktari.Windows.Tests.BatchFailureTests|FullyQualifiedName~Vaktari.Windows.Tests.RetryAfterFailureTests"

      - name: Revert-check
        run: powershell -ExecutionPolicy Bypass -NoProfile -File measure/mutations.ps1

      - name: The whole Windows suite
        run: dotnet test tests/Vaktari.Windows.Tests -c Debug

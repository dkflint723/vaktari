name: build

# TEMPORARY. Borrowed for the undo measurement and restored before the change is
# committed: workflow_dispatch only runs a workflow that already exists on the
# default branch, so a measurement on a branch has to borrow this file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: The junction tests
        run: >
          dotnet test tests/Vaktari.Windows.Tests -c Debug
          --filter "FullyQualifiedName~Vaktari.Windows.Tests.ReparsePointTests|FullyQualifiedName~Vaktari.Windows.Tests.UndoMergeTests|FullyQualifiedName~Vaktari.Windows.Tests.RedoTests|FullyQualifiedName~Vaktari.Windows.Tests.DeleteTests"

name: build

# Every push to main proves the tree still builds; a v* tag additionally
# publishes a release. Separating those means a broken commit is caught without
# anyone having to remember to tag.
#
# Two jobs, one per platform, and neither cross-compiles. The Linux job produces
# a tarball plus install.sh; the Windows job produces an Inno Setup installer,
# because a bare zip on Windows leaves the user to invent their own Start menu
# entry and uninstall. The Windows job is also the only place
# Vaktari.Windows.Tests actually runs.
on:
  push:
    branches: [main]
    # `v[0-9]*`, not `v*`: the version below parses the same shape, and a tag
    # that triggers the workflow but fails that parse used to publish a real
    # release with every asset stamped 0.0.0.
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read by default. Only the release job needs to write, and it is the only job
# gated on a tag -- the build jobs run on every pull request, where they compile
# and execute branch-authored code and have no business holding a write token.
permissions:
  contents: read

# Cancel superseded pull request runs; never cancel a push to main or a tag,
# where a half-finished run means a half-uploaded release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    # **A bound, because a hung step once burned the whole six-hour
    # ceiling.** apt on the hosted runner could not reach a mirror and
    # retried in silence; the job was killed at the limit and the
    # release that needed it never ran. This job takes minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing here pushes, and the default leaves the job's token in
          # .git/config for the whole run, where anything the build executes
          # can read it.
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # NativeAOT links with clang and needs zlib's headers. Without these the
      # publish fails late, after a full restore and compile.
      # **This is the step that hung for six hours.** apt could not reach a
      # mirror, retried in silence, and the job was killed at the ceiling
      # without ever building anything — while the same commit's Windows job
      # finished in under four minutes.
      #
      # Three answers, cheapest first: skip the network entirely when the image
      # already carries both packages, which it usually does; give apt its own
      # retry and connection budget so a slow mirror fails rather than stalls;
      # and bound the step, so the worst case costs ten minutes instead of a
      # release.
      - name: NativeAOT prerequisites
        timeout-minutes: 10
        run: |
          set -euo pipefail

          if dpkg -s clang zlib1g-dev >/dev/null 2>&1; then
            echo "clang and zlib1g-dev are already on the image; nothing to fetch."
            exit 0
          fi

          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'

          sudo apt-get $APT update

          sudo apt-get $APT install -y --no-install-recommends clang zlib1g-dev

      # Debug first: TreatWarningsAsErrors plus the trim, AOT and single-file
      # analysers are all on here, so this catches a trim-hostile dependency as
      # a warning rather than as a runtime failure in the published binary.
      - name: Build
        run: dotnet build -c Debug

      # After the Debug build (which is where the analysers run) and before the
      # publish, so a broken assumption fails in seconds rather than after a
      # 55-second AOT link.
      # Core AND Linux. Not the whole solution: Vaktari.Windows.Tests drives
      # the shell and the registry, and fails wholesale here — which is why this
      # job has always named its projects rather than the .slnx. The Linux
      # project was added when an audit found four faults in Vaktari.Linux that
      # nothing anywhere was testing; naming it here is what stops that
      # recurring.
      - name: Test
        run: |
          dotnet test tests/Vaktari.Core.Tests --configuration Debug
          dotnet test tests/Vaktari.Linux.Tests --configuration Debug

      - name: Publish
        run: |
          # Same tag-shaped test the distro workflow uses: `${VAR:-default}`
          # does not fire for a branch name, so a push to main would otherwise
          # stamp the binary with the literal string "main".
          #
          # A TAG that does not parse is a hard error rather than a silent
          # 0.0.0: 0.0.0 is the right answer for a branch build and the wrong
          # one for anything that is about to be published.
          case "$GITHUB_REF_NAME" in
            v[0-9]*) VERSION_NUMBER="${GITHUB_REF_NAME#v}" ;;
            *)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                echo "tag $GITHUB_REF_NAME is not v<number>; refusing to stamp 0.0.0" >&2
                exit 1
              fi
              VERSION_NUMBER="0.0.0"
              ;;
          esac

          echo "stamping version $VERSION_NUMBER"

          dotnet publish src/Vaktari.Ui -c Release -r linux-x64 -p:PublishAot=true \
            -p:Version="$VERSION_NUMBER"

      # The publish DIRECTORY is the deliverable, not the executable.
      # libSkiaSharp.so and libHarfBuzzSharp.so sit beside the binary and are
      # loaded from its own directory; shipping the executable alone produces
      # something that aborts before it draws anything.
      - name: Package
        run: |
          P=src/Vaktari.Ui/bin/Release/net10.0/linux-x64/publish
          test -f "$P/libSkiaSharp.so" || { echo "libSkiaSharp.so missing"; exit 1; }

          mkdir -p dist/vaktari
          cp -a "$P"/. dist/vaktari/
          cp packaging/install.sh dist/vaktari/

          # MIT requires the notice to travel with "all copies or substantial
          # portions", so a binary tarball without it does not satisfy the
          # licence the project ships under. The distro tarballs already carried
          # these; this one did not.
          cp LICENSE README.md dist/vaktari/

          # The icons, which the tarball never carried. install.sh has always
          # tried to install them and always found nothing: the application's
          # own icon is an AvaloniaResource compiled INTO the assembly, so it
          # never appears in the publish directory, and nothing else put one
          # here. The result was a desktop entry whose Icon= key resolved to
          # nothing and a blank tile in the launcher.
          cp brand/icons/hicolor/scalable/apps/vaktari.svg dist/vaktari/
          cp brand/icons/hicolor/symbolic/apps/vaktari-symbolic.svg dist/vaktari/

          chmod +x dist/vaktari/install.sh dist/vaktari/Vaktari.Ui

          tar -czf vaktari-linux-x64.tar.gz -C dist vaktari
          sha256sum vaktari-linux-x64.tar.gz | tee vaktari-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: vaktari-linux-x64
          path: |
            vaktari-linux-x64.tar.gz
            vaktari-linux-x64.tar.gz.sha256
          retention-days: 2

  windows-x64:
    runs-on: windows-latest
    # **A bound, because a hung step once burned the whole six-hour
    # ceiling.** apt on the hosted runner could not reach a mirror and
    # retried in silence; the job was killed at the limit and the
    # release that needed it never ran. This job takes minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # No equivalent of the linux-x64 prerequisites step: the runner image
      # already carries the MSVC toolchain NativeAOT links with. Locally it
      # needs Visual Studio or the Build Tools, and vswhere.exe on PATH -- the
      # failure without it names link.exe and is not obviously about vswhere.

      - name: Build
        run: dotnet build -c Debug

      # Both projects, unlike the Linux job: Vaktari.Windows.Tests is where the
      # file operations are actually exercised, and it is the reason to run this
      # job on a Windows machine rather than cross-compiling.
      - name: Test
        run: dotnet test vaktari.slnx -c Debug

      - name: Publish
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) VERSION_NUMBER="${GITHUB_REF_NAME#v}" ;;
            *)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                echo "tag $GITHUB_REF_NAME is not v<number>; refusing to stamp 0.0.0" >&2
                exit 1
              fi
              VERSION_NUMBER="0.0.0"
              ;;
          esac

          echo "stamping version $VERSION_NUMBER"
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"

          dotnet publish src/Vaktari.Ui -c Release -r win-x64 -p:PublishAot=true \
            -p:Version="$VERSION_NUMBER"

      # Same check the Linux job makes for libSkiaSharp.so, and for the same
      # reason: these sit beside the binary and are loaded from its own
      # directory, so an installer built without them produces something that
      # aborts before it draws anything.
      - name: Package
        shell: bash
        run: |
          P=src/Vaktari.Ui/bin/Release/net10.0/win-x64/publish

          for required in Vaktari.Ui.exe libSkiaSharp.dll libHarfBuzzSharp.dll av_libglesv2.dll; do
            test -f "$P/$required" || { echo "$required missing from the publish"; exit 1; }
          done

          # ISCC is preinstalled on the windows runner image. Resolved rather
          # than assumed to be on PATH, which it is not.
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -x "$ISCC" || { echo "Inno Setup not found at $ISCC"; exit 1; }

          # Logged because the script uses ArchitecturesAllowed=x64compatible,
          # which needs 6.3 or newer. If the runner image ever ships something
          # older this is the line that explains the compile error.
          "$ISCC" | head -2 || true

          "$ISCC" //DAppVersion="$VERSION_NUMBER" //DPayload="$(cygpath -w "$PWD/$P")" \
            packaging/vaktari.iss

          SETUP="vaktari-$VERSION_NUMBER-win-x64-setup.exe"
          test -f "dist/$SETUP" || { echo "dist/$SETUP was not produced"; exit 1; }

          # Hashed from inside dist/, so the file records a bare filename. Doing
          # it from here would write "dist/vaktari-...exe", and the artifact and
          # the release asset both flatten that away -- leaving a checksum file
          # that cannot be checked anywhere it is actually downloaded to.
          ( cd dist && sha256sum "$SETUP" | tee "$SETUP.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: vaktari-win-x64
          path: |
            dist/*.exe
            dist/*.sha256
          retention-days: 2

  # One job owns the release, rather than each build job racing to create it.
  # Both platforms' assets go up in a single call, so a reader never sees a
  # tarball published beside another run's checksum.
  release:
    needs: [linux-x64, windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # **A bound, because a hung step once burned the whole six-hour
    # ceiling.** apt on the hosted runner could not reach a mirror and
    # retried in silence; the job was killed at the limit and the
    # release that needed it never ran. This job takes minutes.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out, and `gh` works out which repository it
          # is talking to by shelling out to git. With no .git anywhere it dies
          # on "failed to run git: fatal: not a git repository" before it can
          # create or upload anything. Naming the repository outright is
          # cheaper than a checkout that exists only to be read by git.
          #
          # distro.yml already carried this line, and the comment explaining
          # why. When "One job owns the release" moved publishing here, the
          # step came across and the variable did not — so v0.5.0 published
          # with the distro packages and without the Windows installer or the
          # plain tarball, because distro.yml still had what build.yml had
          # lost.
          GH_REPO: ${{ github.repository }}
        run: |
          # --prerelease is derived, not unconditional. Passing it for every tag
          # marked even a stable release as a prerelease, which suppresses the
          # Latest badge and leaves /releases/latest pointing at whatever older
          # release was not flagged.
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac

          # distro.yml is triggered by the same tag and may get here first, so a
          # release that already exists is not an error. The trailing `view`
          # keeps a lost race from failing the step before the upload runs.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRERELEASE \
            || gh release view "$GITHUB_REF_NAME" >/dev/null

          gh release upload "$GITHUB_REF_NAME" \
            assets/vaktari-linux-x64/* assets/vaktari-win-x64/* \
            --clobber

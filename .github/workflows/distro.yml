name: distro packages

# Separate from build.yml on purpose. That workflow is the fast check on every
# push; this one runs in containers, takes minutes, and only needs to run when a
# release is being cut or when someone asks for it.
on:
  push:
    # `v[0-9]*` to match the version parsing below, as in build.yml.
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a tag run mid-upload; this only guards against two runs of the
# same tag (a re-cut tag, or a dispatch racing the push) interleaving their
# uploads and leaving an artifact beside another run's checksum.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------- Fedora ---
  fedora:
    runs-on: ubuntu-latest
    # **A bound, because a hung step once burned the whole six-hour
    # ceiling.** apt on the hosted runner could not reach a mirror and
    # retried in silence; the job was killed at the limit and the
    # release that needed it never ran. This job takes minutes.
    timeout-minutes: 30
    container: fedora:latest

    steps:
      - name: Toolchain
        run: |
          dnf -y install git rpm-build tar clang zlib-devel
          # Fedora's package name is version-pinned, so a release that does not
          # carry .NET 10 yet must fall back rather than fail the job.
          dnf -y install dotnet-sdk-10.0 || {
            echo "dotnet-sdk-10.0 not in this Fedora release; using the installer"
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          }

      - uses: actions/checkout@v5

      - name: Build
        run: |
          dotnet --version

          # Same tag-shaped test as the RPM step, and for the same reason:
          # `${VAR:-default}` does not fire for a branch name, so a dispatch run
          # would otherwise stamp the binary with the literal string "main".
          case "$GITHUB_REF_NAME" in
            v[0-9]*) VERSION_NUMBER="${GITHUB_REF_NAME#v}" ;;
            *)       VERSION_NUMBER="0.0.0" ;;
          esac

          echo "stamping version $VERSION_NUMBER"

          dotnet publish src/Vaktari.Ui -c Release -r linux-x64 -p:PublishAot=true \
            -p:Version="$VERSION_NUMBER"

      - name: Stage the publish tree
        run: |
          P=src/Vaktari.Ui/bin/Release/net10.0/linux-x64/publish
          test -f "$P/libSkiaSharp.so" || { echo "libSkiaSharp.so missing"; exit 1; }
          mkdir -p dist/vaktari
          cp -a "$P"/. dist/vaktari/
          cp LICENSE THIRD-PARTY-NOTICES.txt README.md dist/vaktari/

          # So install.sh can offer the symbolic icon; the RPM takes its copy
          # straight from brand/ instead.
          cp brand/icons/hicolor/symbolic/apps/vaktari-symbolic.svg dist/vaktari/ || true

          tar -czf vaktari-linux-x64-fedora.tar.gz -C dist vaktari

      - name: Build the RPM
        run: |
          # `${VAR:-default}` substitutes only when VAR is EMPTY or UNSET. On a
          # branch run GITHUB_REF_NAME is "main", which is neither — so the old
          # form produced `vaktari-main-1.fc44.rpm` rather than falling back.
          # Match the shape of a tag instead of testing for emptiness.
          case "$GITHUB_REF_NAME" in
            v[0-9]*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)       VERSION="0.0.0" ;;
          esac

          echo "building version $VERSION from ref $GITHUB_REF_NAME"

          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          cp vaktari-linux-x64-fedora.tar.gz ~/rpmbuild/SOURCES/vaktari-linux-x64.tar.gz
          cp brand/vaktari.desktop ~/rpmbuild/SOURCES/
          cp -a brand/icons ~/rpmbuild/SOURCES/

          rpmbuild -bb packaging/vaktari.spec --define "version $VERSION"

          BUILT=$(find ~/rpmbuild/RPMS -name "vaktari-$VERSION-*.rpm" | head -1)
          test -n "$BUILT" || { echo "rpmbuild produced no vaktari-$VERSION rpm"; exit 1; }

          cp "$BUILT" .
          echo "RPM=$(basename "$BUILT")" >> "$GITHUB_ENV"

      # An RPM that installs is the only proof that matters. `rpm -i` runs the
      # dependency solver, so a missing Requires fails here rather than on
      # somebody's machine.
      - name: Install it, then run it
        run: |
          # By name. A bare ./*.rpm also matched an RPM that had been committed
          # to the repository by accident, and dnf refused the pair as a
          # conflict — a confusing way to learn about a stray file.
          dnf -y install "./$RPM"
          test -x /usr/bin/vaktari
          # NOT `|| true` any more. `--version` is answered before any window is
          # created, so it works with no display — and a binary that cannot print
          # its own version is one nobody should be shipping. This is now a real
          # check rather than a comment claiming to be one.
          vaktari --version

      - uses: actions/upload-artifact@v7
        with:
          name: fedora
          path: |
            *.rpm
            vaktari-linux-x64-fedora.tar.gz

  # ------------------------------------------------------------------ Arch ---
  arch:
    runs-on: ubuntu-latest
    # **A bound, because a hung step once burned the whole six-hour
    # ceiling.** apt on the hosted runner could not reach a mirror and
    # retried in silence; the job was killed at the limit and the
    # release that needed it never ran. This job takes minutes.
    timeout-minutes: 30
    container: archlinux:latest

    steps:
      - name: Toolchain
        run: |
          pacman -Syu --noconfirm git base-devel dotnet-sdk clang

          # makepkg refuses to run as root, so give it an unprivileged user.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v5

      - name: Build
        run: |
          dotnet --version

          # Same tag-shaped test as the RPM step, and for the same reason:
          # `${VAR:-default}` does not fire for a branch name, so a dispatch run
          # would otherwise stamp the binary with the literal string "main".
          case "$GITHUB_REF_NAME" in
            v[0-9]*) VERSION_NUMBER="${GITHUB_REF_NAME#v}" ;;
            *)       VERSION_NUMBER="0.0.0" ;;
          esac

          echo "stamping version $VERSION_NUMBER"

          dotnet publish src/Vaktari.Ui -c Release -r linux-x64 -p:PublishAot=true \
            -p:Version="$VERSION_NUMBER"

      - name: Stage the publish tree
        run: |
          P=src/Vaktari.Ui/bin/Release/net10.0/linux-x64/publish
          test -f "$P/libSkiaSharp.so" || { echo "libSkiaSharp.so missing"; exit 1; }
          mkdir -p dist/vaktari
          cp -a "$P"/. dist/vaktari/
          cp LICENSE THIRD-PARTY-NOTICES.txt README.md dist/vaktari/
          tar -czf vaktari-linux-x64-arch.tar.gz -C dist vaktari

      # Validates the PKGBUILD's syntax and metadata without downloading the
      # tagged tarball, which will not exist until the release is published.
      - name: Check the PKGBUILD
        run: |
          chown -R builder .
          su builder -c 'cd packaging && makepkg --printsrcinfo > .SRCINFO'
          cat packaging/.SRCINFO

      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: |
            vaktari-linux-x64-arch.tar.gz
            packaging/.SRCINFO

  # --------------------------------------------------------------- release ---
  release:
    needs: [fedora, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # **A bound, because a hung step once burned the whole six-hour
    # ceiling.** apt on the hosted runner could not reach a mirror and
    # retried in silence; the job was killed at the limit and the
    # release that needed it never ran. This job takes minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }

      - env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads artifacts and never checks out, so there is no
          # .git for gh to infer the repository from — without this it dies with
          # "failed to run git: fatal: not a git repository". Cheaper than
          # cloning the tree just to upload three files.
          GH_REPO: ${{ github.repository }}
        run: |
          find artifacts -type f -printf '%p\n'

          # Same reasoning as build.yml, including the derived --prerelease:
          # whichever workflow wins the race decides the release's flags, so
          # they have to agree. The trailing `view` keeps a lost race from
          # failing the step before the upload runs.
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac

          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRERELEASE \
            || gh release view "$GITHUB_REF_NAME" >/dev/null

          # Scoped to the artifact directories this workflow uploaded, so a file
          # that happens to sit in the workspace cannot be published by accident.
          gh release upload "$GITHUB_REF_NAME" \
            $(find artifacts/fedora artifacts/arch -type f \
                \( -name 'vaktari-*.rpm' -o -name 'vaktari-*.tar.gz' \)) \
            --clobber
